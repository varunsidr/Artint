services:
  artint:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARTINT_PORT:-8501}:8501"
    environment:
      ARTICLE_LIBRARY_DB: /var/lib/artint/data/articles.db
      ARTICLE_PDF_DIR: /var/lib/artint/pdfs
      ARTICLE_BROWSER_CHANNEL: chromium
      # Optional; never required for startup, reading, search, PDFs or notes.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - library:/var/lib/artint/data
      - pdfs:/var/lib/artint/pdfs
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    shm_size: 256mb
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/chromium-seccomp.json

volumes:
  library:
  pdfs:
