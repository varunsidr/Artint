name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUN_BROWSER_TESTS: '1'
      ARTICLE_BROWSER_CHANNEL: chromium
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-linux-lock.txt
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-dev.txt
      - name: Install Linux dependencies with runtime constraints
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-dev.txt -c requirements-linux-lock.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Install Windows test browser
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Install Linux browser and system libraries
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Permit Chromium namespaces on AppArmor-enabled Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && \
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "1" ]; then
            python scripts/check_install.py --apparmor-profile > "$RUNNER_TEMP/artint-chromium.profile"
            sudo apparmor_parser -r "$RUNNER_TEMP/artint-chromium.profile"
          fi
      - name: Check installation and browser sandbox
        run: python scripts/check_install.py --browser
      - name: Run tests with deterministic browser fixture
        run: python -m pytest -q
      - name: Build synthetic demo
        run: python scripts/seed_demo.py --output output/ci-demo
      - name: Verify isolated PDF, search and portable restore
        run: python scripts/smoke_install.py
      - name: Verify native startup and live reading UI
        run: python scripts/validate_native.py

  container:
    name: Docker / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and validate disposable containers
        run: python3 scripts/validate_container.py --report output/container-validation.json
